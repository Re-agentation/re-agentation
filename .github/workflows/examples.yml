name: Examples smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'examples/**'
      - '.github/workflows/examples.yml'

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo bundle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' build

      - name: Bundle Expo example (Metro)
        run: |
          pnpm --filter expo-example exec npx expo export --platform ios --dev --output-dir ./dist-bundle || \
          (echo "Expo bundle smoke failed" && exit 1)

  rn-cli:
    name: RN CLI bundle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' build

      - name: Bundle RN CLI example (Metro)
        # `react-native bundle` doesn't require Xcode/Android Studio and runs on Linux.
        run: |
          pnpm --filter rn-cli-example exec react-native bundle \
            --platform ios \
            --dev true \
            --entry-file index.js \
            --bundle-output ./bundle.js \
            --assets-dest ./assets || \
          (echo "RN CLI bundle smoke failed" && exit 1)
