name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck (workspace)
        run: pnpm typecheck

      - name: Build (workspace)
        run: pnpm build

      - name: Test (workspace)
        run: pnpm test

      - name: Changeset check (PRs only)
        # Skip on the changesets "Version Packages" PR — it intentionally has no
        # changeset (it consumes them), so the check would always fail there.
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          # A release is only needed when a published package's SOURCE changes.
          # Dev-dependency / tooling / lockfile / config bumps (incl. dependabot)
          # ride along with the next real release and need no changeset.
          if git diff --name-only origin/main...HEAD | grep -qE '^packages/[^/]+/src/'; then
            npx changeset status --since=origin/main || (echo "Package source changed — add a changeset: run 'pnpm changeset' and commit the file." && exit 1)
          else
            echo "No package src changes (deps/tooling/config only) — changeset not required."
          fi
