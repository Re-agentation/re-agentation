name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear, factual description.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: Steps or a small repo link. The smaller the better.
    validations:
      required: true
  - type: input
    id: rn-version
    attributes:
      label: React Native version
      placeholder: '0.76.5'
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: '19.0.0'
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: RN setup
      options:
        - Bare RN CLI
        - Expo
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS Simulator
        - Android Emulator
        - iOS device
        - Android device
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      multiple: true
      options:
        - '@re-agentation/probe'
        - '@re-agentation/metro'
        - '@re-agentation/mcp'
    validations:
      required: true
